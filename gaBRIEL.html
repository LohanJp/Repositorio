<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Painel do Vendedor</title>
<meta name="theme-color" content="#16a34a" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#16a34a;
    --green-dark:#0f7a37;
    --green-soft:#e7f7ee;
    --bg:#f0f2f5;
    --card:#ffffff;
    --ink:#0f1115;
    --muted:#6b7280;
    --danger:#e5484d;
    --danger-soft:#fdeaea;
    --line:#e9eaee;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:12px;
    --shadow: 0 1px 2px rgba(15,17,21,0.04), 0 8px 20px -12px rgba(15,17,21,0.12);
    --font-display:'Manrope', system-ui, sans-serif;
    --font-body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    font-family:var(--font-body);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  #app{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }
  .status-spacer{ height: env(safe-area-inset-top, 0px); }
  .page{
    flex:1;
    padding:20px 18px 100px;
    animation:fadein .18s ease;
  }
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  h1.page-title{
    font-family:var(--font-display);
    font-weight:800;
    font-size:32px;
    letter-spacing:-0.02em;
    margin:6px 0 20px;
  }
  .title-row{ display:flex; align-items:center; justify-content:space-between; }
  .fab{
    width:44px; height:44px; border-radius:14px;
    background:var(--green); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; box-shadow:var(--shadow); cursor:pointer;
    transition: transform .12s ease;
  }
  .fab:active{ transform:scale(0.92); }

  /* ---- cards / grid ---- */
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .card{
    background:var(--card);
    border-radius:var(--radius-lg);
    padding:18px;
    box-shadow:var(--shadow);
  }
  .stat-label{ color:var(--muted); font-size:14px; margin-bottom:8px; }
  .stat-value{ font-family:var(--font-display); font-weight:800; font-size:24px; letter-spacing:-0.01em; }
  .stat-value.danger{ color:var(--danger); }
  .stat-value.pos{ color:var(--green-dark); }

  .chart-card{ margin-bottom:12px; }
  .chart-title{ color:var(--muted); font-size:14px; margin-bottom:14px; }
  .legend{ display:flex; gap:16px; margin:-4px 0 12px; font-size:12.5px; color:var(--muted); font-weight:600; flex-wrap:wrap; }
  .legend-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle; }
  .report-tooltip{ text-align:center; font-size:13px; font-weight:700; color:var(--ink); margin-bottom:10px; min-height:18px; transition:opacity .12s ease; }
  .bars{ display:flex; align-items:flex-end; justify-content:space-between; height:170px; gap:6px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; cursor:pointer; border-radius:8px; padding:4px 0; transition:background .12s ease; }
  .bar-col:hover, .bar-col.active{ background:var(--bg); }
  .bar-pair{ display:flex; align-items:flex-end; justify-content:center; gap:3px; width:100%; height:100%; }
  .bar{ flex:1; max-width:16px; background:var(--green); border-radius:6px 6px 3px 3px; transition:height .4s ease; }
  .bar.expense{ background:var(--danger); }
  .bar.empty{ background:#eef0f3; height:4px !important; }
  .bar-label{ margin-top:8px; font-size:11.5px; color:var(--muted); }

  .profit-card{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .profit-sub{ color:var(--muted); font-size:13px; margin-top:4px; }
  .pill-btn{
    background:var(--bg); border:none; padding:12px 18px; border-radius:999px;
    font-weight:600; font-size:14px; color:var(--ink); cursor:pointer; white-space:nowrap;
  }
  .pill-btn.primary{ background:var(--green); color:#fff; }
  .pill-btn.danger-outline{ background:var(--danger-soft); color:var(--danger); }
  .pill-btn:active{ opacity:.85; }

  /* ---- bottom nav ---- */
  nav.tabbar{
    position:sticky; bottom:0; left:0; right:0;
    background:#fff;
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -6px 18px -14px rgba(0,0,0,.25);
    z-index:20;
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; padding:8px 2px; border-radius:14px;
    color:#8a8f98; font-size:11px; font-family:var(--font-body); font-weight:600;
    cursor:pointer;
  }
  .tab svg{ width:22px; height:22px; }
  .tab.active{ color:var(--green); background:var(--green-soft); }

  /* ---- search / filters ---- */
  .search{
    width:100%; padding:14px 16px; border-radius:999px; border:none;
    background:#e6e8ec; font-size:15px; font-family:var(--font-body); margin-bottom:14px;
  }
  .search:focus{ outline:2px solid var(--green); }
  .chip-row{ display:flex; gap:8px; margin-bottom:18px; }
  .chip{ padding:10px 16px; border-radius:999px; border:none; background:#e6e8ec; font-weight:600; font-size:14px; color:var(--ink); cursor:pointer; }
  .chip.active{ background:var(--ink); color:#fff; }

  .list-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 4px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .list-item:last-child{ border-bottom:none; }
  .li-name{ font-weight:700; font-size:16px; }
  .li-sub{ color:var(--muted); font-size:14px; margin-top:2px; }
  .badge{ padding:6px 12px; border-radius:999px; font-size:13px; font-weight:700; white-space:nowrap; }
  .badge.open{ background:var(--danger-soft); color:var(--danger); }
  .empty-state{ text-align:center; color:var(--muted); padding:60px 20px; font-size:15px; }
  .empty-state .em-icon{ font-size:38px; margin-bottom:10px; display:block; }

  /* ---- estoque item ---- */
  .stock-item{ display:flex; align-items:center; justify-content:space-between; padding:16px 4px; border-bottom:1px solid var(--line); }
  .stock-item:last-child{ border-bottom:none; }
  .stock-qty{ font-family:var(--font-display); font-weight:800; font-size:20px; }
  .stock-qty.low{ color:var(--danger); }

  /* ---- forms / sheet ---- */
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-weight:700; font-size:14px; margin-bottom:8px; }
  .field input[type=text], .field input[type=number], .field input[type=tel], .field textarea, .field select{
    width:100%; padding:14px 16px; border-radius:16px; border:1.5px solid var(--line);
    font-size:15px; font-family:var(--font-body); background:#fff; color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:90px; line-height:1.4; }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--green); }
  .hint{ color:var(--muted); font-size:12.5px; margin-top:6px; }
  .seg{ display:flex; background:#eef0f3; border-radius:14px; padding:4px; gap:4px; }
  .seg button{ flex:1; border:none; background:none; padding:11px 8px; border-radius:11px; font-weight:700; font-size:14px; color:var(--muted); cursor:pointer; }
  .seg button.active{ background:#fff; color:var(--ink); box-shadow:var(--shadow); }

  .btn-block{ width:100%; padding:16px; border:none; border-radius:16px; background:var(--green); color:#fff; font-weight:700; font-size:16px; cursor:pointer; margin-top:6px; }
  .btn-block:active{ background:var(--green-dark); }
  .btn-block.secondary{ background:var(--bg); color:var(--ink); }
  .btn-block.wa{ background:#25D366; }

  /* ---- sheet/modal ---- */
  .sheet-backdrop{ position:fixed; inset:0; background:rgba(15,17,21,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center; animation:fadein2 .15s ease; }
  @keyframes fadein2{ from{opacity:0;} to{opacity:1;} }
  .sheet{
    width:100%; max-width:460px; background:#fff; border-radius:24px 24px 0 0;
    padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow-y:auto;
    animation:slideup .22s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideup{ from{ transform:translateY(30px); opacity:.4; } to{ transform:translateY(0); opacity:1; } }
  .sheet-handle{ width:40px; height:5px; background:var(--line); border-radius:99px; margin:0 auto 16px; }
  .sheet-title{ font-family:var(--font-display); font-weight:800; font-size:22px; margin-bottom:18px; }
  .sheet-close{ position:absolute; top:18px; right:18px; background:#f0f2f5; border:none; width:34px; height:34px; border-radius:50%; font-size:16px; color:var(--muted); cursor:pointer; }

  /* ---- back header ---- */
  .back-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .back-btn{ background:none; border:none; font-size:22px; color:var(--ink); cursor:pointer; padding:4px 8px 4px 0; }

  /* ---- discador ---- */
  .dial-display{ text-align:center; font-family:var(--font-display); font-weight:700; font-size:30px; min-height:64px; display:flex; align-items:center; justify-content:center; letter-spacing:1px; padding:0 10px; word-break:break-all; }
  .dial-display.placeholder{ color:#c7cad1; font-weight:500; font-size:22px; }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:26px; }
  .key{ aspect-ratio:1; border-radius:50%; border:none; background:#e6e8ec; font-family:var(--font-display); font-weight:700; font-size:24px; color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; }
  .key small{ font-size:9px; font-weight:600; color:var(--muted); letter-spacing:1px; margin-top:1px; }
  .key:active{ background:#d9dce1; }
  .key.action{ background:var(--green); color:#fff; }
  .key.action:active{ background:var(--green-dark); }
  .key.ghost{ background:none; color:var(--muted); }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background:#1c1f26; color:#fff; padding:12px 14px 12px 20px; border-radius:14px; font-size:14px; font-weight:600;
    z-index:100; box-shadow:0 8px 24px rgba(0,0,0,.3); max-width:90%; text-align:center;
    animation:toastin .18s ease; display:flex; align-items:center; gap:14px;
  }
  .toast-action{
    background:none; border:none; color:#4ade80; font-weight:800; font-size:14px; cursor:pointer;
    padding:6px 8px; white-space:nowrap; flex-shrink:0;
  }
  @keyframes toastin{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }

  .sale-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  .sale-row:last-child{ border-bottom:none; }
  .sale-main{ font-weight:600; font-size:14.5px; }
  .sale-sub{ color:var(--muted); font-size:12.5px; margin-top:2px; }
  .sale-amt{ font-weight:800; font-family:var(--font-display); }
  .tag-open{ color:var(--danger); font-size:12px; font-weight:700; }
  .tag-paid{ color:var(--green-dark); font-size:12px; font-weight:700; }

  a.plain{ color:inherit; text-decoration:none; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   STORAGE
   ========================================================= */
const STORAGE_KEY = "painel_vendedor_data_v1";

function safeLocalStorage(){
  try{
    const t = "__t__";
    window.localStorage.setItem(t,"1");
    window.localStorage.removeItem(t);
    return window.localStorage;
  }catch(e){ return null; }
}
const LS = safeLocalStorage();
let memoryFallback = null;

function loadData(){
  const raw = LS ? LS.getItem(STORAGE_KEY) : memoryFallback;
  if(raw){
    try{ return JSON.parse(raw); }catch(e){ /* fallthrough */ }
  }
  return {
    clients: [],
    products: [],
    sales: [],
    expenses: [],
    settings: {
      name: "",
      whatsappMsg: "Opa tudo bem, muito obrigado pela confiança em minha causa e pela força 🙏",
      chargeTemplate: "Oi {nome}! Passando pra lembrar do pagamento de {valor} referente a {produto}. Já se passaram {dias} dia(s). Consegue acertar hoje? 🙏",
      toleranceDays: 3
    }
  };
}
function saveData(){
  const raw = JSON.stringify(state);
  if(LS){ try{ LS.setItem(STORAGE_KEY, raw); }catch(e){ memoryFallback = raw; } }
  else{ memoryFallback = raw; }
}

let state = loadData();
let ui = { page: "painel", dialInput: "", clientFilter: "all", clientSearch: "", sheet: null, sheetData: null, reportPeriod: "dia" };

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(n){
  return "R$ " + (Math.round((n||0)*100)/100).toFixed(2).replace(".", ",");
}
function fmtDate(d){
  const dt = new Date(d+"T00:00:00");
  return dt.toLocaleDateString("pt-BR",{day:"2-digit", month:"2-digit"});
}
function daysBetween(a,b){
  const A = new Date(a+"T00:00:00"), B = new Date(b+"T00:00:00");
  return Math.round((B-A)/86400000);
}
function digitsOnly(s){ return (s||"").replace(/\D/g,""); }
function formatPhoneDisplay(digits){
  const d = digitsOnly(digits);
  if(d.length <= 2) return d;
  if(d.length <= 6) return "("+d.slice(0,2)+") "+d.slice(2);
  if(d.length <= 10) return "("+d.slice(0,2)+") "+d.slice(2,6)+"-"+d.slice(6);
  return "("+d.slice(0,2)+") "+d.slice(2,7)+"-"+d.slice(7,11);
}
function waLink(phoneDigits, message){
  let p = digitsOnly(phoneDigits);
  if(p.length <= 11) p = "55" + p; // assume BR if no country code
  return "https://wa.me/"+p+"?text="+encodeURIComponent(message);
}
let toastTimer = null;
let toastEl = null;
function toast(msg, action){
  if(toastEl){ toastEl.remove(); }
  if(toastTimer){ clearTimeout(toastTimer); }
  const el = document.createElement("div");
  el.className = "toast";
  const text = document.createElement("span");
  text.textContent = msg;
  el.appendChild(text);
  if(action){
    const btn = document.createElement("button");
    btn.textContent = action.label;
    btn.className = "toast-action";
    btn.addEventListener("click", ()=>{
      action.onClick();
      el.remove();
      if(toastTimer) clearTimeout(toastTimer);
    });
    el.appendChild(btn);
  }
  document.body.appendChild(el);
  toastEl = el;
  toastTimer = setTimeout(()=>{ el.remove(); if(toastEl===el) toastEl=null; }, action ? 4500 : 2200);
}
function findClientByPhone(digits){
  const d = digitsOnly(digits);
  return state.clients.find(c => digitsOnly(c.phone) === d);
}
function clientOpenBalance(clientId){
  return state.sales.filter(s => s.clientId===clientId && !s.paid).reduce((a,s)=>a+s.amount,0);
}
function clientLastSale(clientId){
  const arr = state.sales.filter(s=>s.clientId===clientId).sort((a,b)=> b.date.localeCompare(a.date));
  return arr[0];
}

/* =========================================================
   ICONS (inline svg, stroke-based, matches minimal style)
   ========================================================= */
const ICONS = {
  discador: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 16.8v2.2a1.6 1.6 0 01-1.75 1.6 15.9 15.9 0 01-6.9-2.45 15.7 15.7 0 01-4.85-4.85A15.9 15.9 0 014.55 6.4 1.6 1.6 0 016.15 4.65h2.2a1.6 1.6 0 011.6 1.38c.1.75.28 1.48.53 2.18a1.6 1.6 0 01-.36 1.69l-.93.93a12.7 12.7 0 004.85 4.85l.93-.93a1.6 1.6 0 011.69-.36c.7.25 1.43.43 2.18.53a1.6 1.6 0 011.36 1.62z"/></svg>`,
  clientes: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1-3.6 4-5.5 7.5-5.5s6.5 1.9 7.5 5.5"/></svg>`,
  cobrar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6.5H6a2 2 0 00-2 2V17a2 2 0 002 2h14"/><path d="M20 10.5H8"/><circle cx="17.5" cy="14" r="1.2" fill="currentColor" stroke="none"/></svg>`,
  estoque: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5L12 12l8-4.5"/><path d="M12 12v9"/></svg>`,
  painel: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>`,
  ajustes: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.7 7.7 0 000-3l1.9-1.4-2-3.4-2.2.7a7.6 7.6 0 00-2.6-1.5L14 2.5h-4l-.5 2.4a7.6 7.6 0 00-2.6 1.5l-2.2-.7-2 3.4L4.6 10.5a7.7 7.7 0 000 3l-1.9 1.4 2 3.4 2.2-.7c.77.66 1.65 1.17 2.6 1.5l.5 2.4h4l.5-2.4a7.6 7.6 0 002.6-1.5l2.2.7 2-3.4-1.9-1.4z"/></svg>`,
};

function buildReportBuckets(period){
  const buckets = [];
  if(period==="dia"){
    for(let i=6;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const key = d.toISOString().slice(0,10);
      buckets.push({ label: key.slice(8,10), match: s => s.date===key });
    }
  } else if(period==="semana"){
    const now = new Date();
    const dow = (now.getDay()+6)%7; // 0=Monday
    const thisMonday = new Date(now); thisMonday.setDate(now.getDate()-dow);
    for(let i=7;i>=0;i--){
      const start = new Date(thisMonday); start.setDate(thisMonday.getDate()-7*i);
      const end = new Date(start); end.setDate(start.getDate()+6);
      const startKey = start.toISOString().slice(0,10);
      const endKey = end.toISOString().slice(0,10);
      const label = String(start.getDate()).padStart(2,"0")+"/"+String(start.getMonth()+1).padStart(2,"0");
      buckets.push({ label, match: s => s.date>=startKey && s.date<=endKey });
    }
  } else if(period==="mes"){
    for(let i=11;i>=0;i--){
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
      const key = d.toISOString().slice(0,7);
      const label = d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","");
      buckets.push({ label, match: s => s.date.slice(0,7)===key });
    }
  } else if(period==="ano"){
    const y = new Date().getFullYear();
    for(let i=4;i>=0;i--){
      const key = String(y-i);
      buckets.push({ label:key, match: s => s.date.slice(0,4)===key });
    }
  }
  return buckets.map(b => ({
    label: b.label,
    total: state.sales.filter(b.match).reduce((a,s)=>a+s.amount,0),
    expense: state.expenses.filter(b.match).reduce((a,e)=>a+e.amount,0)
  }));
}

/* =========================================================
   RENDER ROOT
   ========================================================= */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="status-spacer"></div>
    <div class="page">${renderPage()}</div>
    ${renderTabbar()}
    ${ui.sheet ? renderSheet() : ""}
  `;
  bindEvents();
}

function renderTabbar(){
  const tabs = [
    {id:"discador", label:"Discador"},
    {id:"clientes", label:"Clientes"},
    {id:"cobrar", label:"Cobrar"},
    {id:"estoque", label:"Estoque"},
    {id:"painel", label:"Painel"},
    {id:"ajustes", label:"Ajustes"},
  ];
  return `<nav class="tabbar">
    ${tabs.map(t => `
      <button class="tab ${ui.page===t.id?'active':''}" data-nav="${t.id}">
        ${ICONS[t.id]}
        <span>${t.label}</span>
      </button>
    `).join("")}
  </nav>`;
}

function renderPage(){
  switch(ui.page){
    case "painel": return renderPainel();
    case "ajustes": return renderAjustes();
    case "estoque": return renderEstoque();
    case "clientes": return renderClientes();
    case "cliente-detalhe": return renderClienteDetalhe();
    case "cobrar": return renderCobrar();
    case "discador": return renderDiscador();
    default: return "";
  }
}

/* =========================================================
   PAINEL
   ========================================================= */
function renderPainel(){
  const today = todayStr();
  const monthKey = today.slice(0,7);
  const hoje = state.sales.filter(s=>s.date===today).reduce((a,s)=>a+s.amount,0);
  const noMes = state.sales.filter(s=>s.date.slice(0,7)===monthKey).reduce((a,s)=>a+s.amount,0);
  const emAberto = state.sales.filter(s=>!s.paid).reduce((a,s)=>a+s.amount,0);
  const vendasTotais = state.sales.length;
  const despesasMes = state.expenses.filter(e=>e.date.slice(0,7)===monthKey).reduce((a,e)=>a+e.amount,0);
  const lucro = noMes - despesasMes;

  const period = ui.reportPeriod || "dia";
  const bars = buildReportBuckets(period);
  const maxVal = Math.max(1, ...bars.map(d=>Math.max(d.total, d.expense)));
  const periodTotal = bars.reduce((a,b)=>a+b.total,0);
  const periodExpense = bars.reduce((a,b)=>a+b.expense,0);
  const periodTitles = { dia:"Últimos 7 dias", semana:"Últimas 8 semanas", mes:"Últimos 12 meses", ano:"Últimos 5 anos" };

  return `
    <div class="title-row">
      <h1 class="page-title">Painel</h1>
    </div>
    <div class="grid2">
      <div class="card"><div class="stat-label">Hoje</div><div class="stat-value">${fmtMoney(hoje)}</div></div>
      <div class="card"><div class="stat-label">No mês</div><div class="stat-value">${fmtMoney(noMes)}</div></div>
      <div class="card"><div class="stat-label">Em aberto</div><div class="stat-value danger">${fmtMoney(emAberto)}</div></div>
      <div class="card"><div class="stat-label">Vendas totais</div><div class="stat-value">${vendasTotais}</div></div>
    </div>
    <div class="card chart-card">
      <div class="title-row" style="margin-bottom:4px;">
        <div class="chart-title" style="margin-bottom:0;">Relatório</div>
      </div>
      <div class="seg" id="report-seg" style="margin-bottom:16px;">
        <button type="button" data-report="dia" class="${period==='dia'?'active':''}">Dia</button>
        <button type="button" data-report="semana" class="${period==='semana'?'active':''}">Semana</button>
        <button type="button" data-report="mes" class="${period==='mes'?'active':''}">Mês</button>
        <button type="button" data-report="ano" class="${period==='ano'?'active':''}">Ano</button>
      </div>
      <div class="chart-title">${periodTitles[period]}</div>
      <div class="legend">
        <span><span class="legend-dot" style="background:var(--green);"></span>Vendas ${fmtMoney(periodTotal)}</span>
        <span><span class="legend-dot" style="background:var(--danger);"></span>Despesas ${fmtMoney(periodExpense)}</span>
      </div>
      <div class="report-tooltip" id="report-tooltip">Toque numa barra para ver os valores</div>
      <div class="bars">
        ${bars.map((d,i) => `
          <div class="bar-col" data-bar-index="${i}" data-sales="${d.total}" data-expense="${d.expense}" data-label="${d.label}">
            <div class="bar-pair">
              <div class="bar ${d.total<=0?'empty':''}" style="height:${d.total<=0?4:Math.max(6,(d.total/maxVal)*140)}px"></div>
              <div class="bar expense ${d.expense<=0?'empty':''}" style="height:${d.expense<=0?4:Math.max(6,(d.expense/maxVal)*140)}px"></div>
            </div>
            <div class="bar-label">${d.label}</div>
          </div>
        `).join("")}
      </div>
    </div>
    <div class="card profit-card">
      <div>
        <div class="stat-label">Lucro do mês</div>
        <div class="stat-value ${lucro<0?'danger':'pos'}">${lucro<0? "-"+fmtMoney(Math.abs(lucro)) : fmtMoney(lucro)}</div>
        <div class="profit-sub">Despesas: ${fmtMoney(despesasMes)}</div>
      </div>
      <button class="pill-btn" data-open-sheet="despesas">Despesas</button>
    </div>
  `;
}

/* =========================================================
   EVENTS
   ========================================================= */
function escapeHtml(str){
  return (str||"").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function closeSheet(){ ui.sheet = null; ui.sheetData = null; render(); }
function openSheet(name, data){ ui.sheet = name; ui.sheetData = data || null; render(); }

function bindEvents(){
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click", ()=>{ ui.page = el.dataset.nav; ui.sheet=null; render(); });
  });
  document.querySelectorAll("[data-open-sheet]").forEach(el=>{
    el.addEventListener("click", ()=> openSheet(el.dataset.openSheet, el.dataset.id));
  });
  document.querySelectorAll("[data-close-sheet]").forEach(el=>{
    el.addEventListener("click", closeSheet);
  });
  document.querySelectorAll("[data-open-client]").forEach(el=>{
    el.addEventListener("click", ()=>{ ui.page="cliente-detalhe"; ui.sheetData=el.dataset.openClient; render(); });
  });
  document.querySelectorAll("[data-filter]").forEach(el=>{
    el.addEventListener("click", ()=>{ ui.clientFilter = el.dataset.filter; render(); });
  });
  const searchEl = document.getElementById("client-search");
  if(searchEl){
    searchEl.addEventListener("input", (e)=>{ ui.clientSearch = e.target.value; renderKeepFocus("client-search"); });
  }
  document.querySelectorAll("[data-dial]").forEach(el=>{
    el.addEventListener("click", ()=>{ ui.dialInput += el.dataset.dial; render(); });
  });
  document.querySelectorAll("[data-report]").forEach(el=>{
    el.addEventListener("click", ()=>{ ui.reportPeriod = el.dataset.report; render(); });
  });
  const tooltip = document.getElementById("report-tooltip");
  if(tooltip){
    document.querySelectorAll("[data-bar-index]").forEach(el=>{
      const showInfo = ()=>{
        document.querySelectorAll("[data-bar-index]").forEach(x=>x.classList.remove("active"));
        el.classList.add("active");
        const sales = parseFloat(el.dataset.sales)||0;
        const expense = parseFloat(el.dataset.expense)||0;
        tooltip.innerHTML = `${el.dataset.label} — Vendas: <span style="color:var(--green-dark)">${fmtMoney(sales)}</span> · Despesas: <span style="color:var(--danger)">${fmtMoney(expense)}</span>`;
      };
      el.addEventListener("click", showInfo);
      el.addEventListener("mouseenter", showInfo);
    });
  }

  document.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", ()=> handleAction(el.dataset.action, el));
  });

  const statusSeg = document.getElementById("s-status-seg");
  if(statusSeg){
    statusSeg.querySelectorAll("button").forEach(b=>{
      b.addEventListener("click", ()=>{
        statusSeg.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
        b.classList.add("active");
      });
    });
    const prodSel = document.getElementById("s-product");
    const qtyInput = document.getElementById("s-vqty");
    const amountInput = document.getElementById("s-vamount");
    function recalc(){
      const p = state.products.find(x=>x.id===prodSel.value);
      if(p){ amountInput.value = (p.price * (parseInt(qtyInput.value)||1)).toFixed(2); }
    }
    if(prodSel){ prodSel.addEventListener("change", recalc); qtyInput.addEventListener("input", recalc); }
  }
}

function renderKeepFocus(id){
  const el = document.getElementById(id);
  const pos = el ? el.selectionStart : null;
  render();
  const el2 = document.getElementById(id);
  if(el2){ el2.focus(); if(pos!==null) el2.setSelectionRange(pos,pos); }
}

function handleAction(action, el){
  const id = el.dataset.id;
  if(action==="save-settings"){
    state.settings.name = document.getElementById("f-name").value.trim();
    state.settings.whatsappMsg = document.getElementById("f-wamsg").value;
    state.settings.chargeTemplate = document.getElementById("f-charge").value;
    state.settings.toleranceDays = parseInt(document.getElementById("f-tol").value)||0;
    saveData();
    toast("Ajustes salvos.");
  }
  else if(action==="logout"){
    if(confirm("Isso vai apagar todos os dados salvos neste aparelho. Deseja continuar?")){
      state = { clients:[], products:[], sales:[], expenses:[], settings:{name:"", whatsappMsg:state.settings.whatsappMsg, chargeTemplate:state.settings.chargeTemplate, toleranceDays:state.settings.toleranceDays} };
      saveData();
      ui.page="painel";
      render();
      toast("Dados locais apagados.");
    }
  }
  else if(action==="save-client"){
    const name = document.getElementById("s-name").value.trim();
    const phone = document.getElementById("s-phone").value.trim();
    if(!phone){ toast("Informe um telefone."); return; }
    if(id){
      const c = state.clients.find(x=>x.id===id);
      c.name = name; c.phone = phone;
    } else {
      state.clients.push({id:uid(), name, phone});
    }
    saveData(); closeSheet(); ui.page="clientes"; render();
    toast("Cliente salvo.");
  }
  else if(action==="delete-client"){
    if(confirm("Excluir este cliente e seu histórico?")){
      state.clients = state.clients.filter(c=>c.id!==id);
      state.sales = state.sales.filter(s=>s.clientId!==id);
      saveData();
      ui.page="clientes"; render();
    }
  }
  else if(action==="save-product"){
    const name = document.getElementById("s-pname").value.trim();
    const price = parseFloat(document.getElementById("s-price").value)||0;
    const qty = parseInt(document.getElementById("s-qty").value)||0;
    if(!name){ toast("Informe um nome."); return; }
    if(id){
      const p = state.products.find(x=>x.id===id);
      p.name=name; p.price=price; p.qty=qty;
    } else {
      state.products.push({id:uid(), name, price, qty});
    }
    saveData(); closeSheet(); render();
    toast("Produto salvo.");
  }
  else if(action==="delete-product"){
    if(confirm("Excluir este produto?")){
      state.products = state.products.filter(p=>p.id!==id);
      saveData(); closeSheet(); render();
    }
  }
  else if(action==="new-sale-for"){
    ui.sheetData = id;
    openSheet("venda", id);
  }
  else if(action==="save-sale"){
    const clientId = document.getElementById("s-client").value;
    if(!clientId){ toast("Selecione um cliente."); return; }
    const productSel = document.getElementById("s-product");
    const product = state.products.find(p=>p.id===productSel.value);
    const qty = parseInt(document.getElementById("s-vqty").value)||1;
    const amount = parseFloat(document.getElementById("s-vamount").value)||0;
    const statusBtn = document.querySelector("#s-status-seg button.active");
    const paid = statusBtn.dataset.status === "paid";
    if(amount<=0){ toast("Informe o valor da venda."); return; }
    state.sales.push({
      id: uid(), clientId, product: product?product.name:"Item avulso",
      amount, qty, date: todayStr(), paid
    });
    if(product){ product.qty = Math.max(0, product.qty - qty); }
    saveData(); closeSheet();
    ui.page = "cliente-detalhe"; ui.sheetData = clientId;
    render();
    toast("Venda registrada.");
  }
  else if(action==="mark-paid"){
    const changedIds = state.sales.filter(s=>s.clientId===id && !s.paid).map(s=>s.id);
    if(changedIds.length===0){ toast("Nada em aberto para marcar."); return; }
    changedIds.forEach(sid => { state.sales.find(s=>s.id===sid).paid = true; });
    saveData(); render();
    toast("Pagamentos marcados.", { label:"Desfazer", onClick: ()=>{
      changedIds.forEach(sid => { const s = state.sales.find(x=>x.id===sid); if(s) s.paid = false; });
      saveData(); render();
      toast("Revertido para em aberto.");
    }});
  }
  else if(action==="toggle-sale"){
    const s = state.sales.find(x=>x.id===id);
    if(!s) return;
    if(s.paid){
      if(confirm("Marcar esta venda como Em aberto novamente?")){
        s.paid = false;
        saveData(); render();
        toast("Venda voltou para Em aberto.");
      }
    } else {
      if(confirm("Marcar esta venda como Paga?")){
        s.paid = true;
        saveData(); render();
        toast("Venda marcada como Paga.", { label:"Desfazer", onClick: ()=>{
          const s2 = state.sales.find(x=>x.id===id);
          if(s2){ s2.paid = false; saveData(); render(); toast("Revertido para em aberto."); }
        }});
      }
    }
  }
  else if(action==="charge-client"){
    const c = state.clients.find(x=>x.id===id);
    const open = clientOpenBalance(id);
    const last = clientLastSale(id);
    const dias = last ? daysBetween(last.date, todayStr()) : state.settings.toleranceDays;
    const msg = state.settings.chargeTemplate
      .replaceAll("{nome}", c.name || formatPhoneDisplay(c.phone))
      .replaceAll("{valor}", fmtMoney(open))
      .replaceAll("{produto}", last ? last.product : "produtos")
      .replaceAll("{dias}", dias);
    window.open(waLink(c.phone, msg), "_blank");
  }
  else if(action==="chat-client"){
    const c = state.clients.find(x=>x.id===id);
    window.open(waLink(c.phone, state.settings.whatsappMsg), "_blank");
  }
  else if(action==="save-expense"){
    const desc = document.getElementById("s-exp-desc").value.trim() || "Despesa";
    const amount = parseFloat(document.getElementById("s-exp-amount").value)||0;
    if(amount<=0){ toast("Informe o valor."); return; }
    state.expenses.push({id:uid(), desc, amount, date: todayStr()});
    saveData(); render();
    toast("Despesa adicionada.");
    openSheet("despesas");
  }
  else if(action==="dial-back"){
    ui.dialInput = ui.dialInput.slice(0,-1); render();
  }
  else if(action==="dial-mic"){
    if(!('webkitSpeechRecognition' in window)){ toast("Reconhecimento de voz não suportado neste navegador."); return; }
    const rec = new webkitSpeechRecognition();
    rec.lang = "pt-BR";
    rec.onresult = (ev)=>{ ui.dialInput += digitsOnly(ev.results[0][0].transcript); render(); };
    rec.start();
  }
  else if(action==="dial-send"){
    if(!ui.dialInput){ toast("Digite um número."); return; }
    const existing = findClientByPhone(ui.dialInput);
    if(existing){
      window.open(waLink(existing.phone, state.settings.whatsappMsg), "_blank");
    } else {
      openSheet("novo-cliente-discador");
    }
  }
  else if(action==="wa-from-dial"){
    window.open(waLink(ui.dialInput, state.settings.whatsappMsg), "_blank");
    closeSheet(); ui.dialInput=""; render();
  }
  else if(action==="save-client-from-dial"){
    const name = document.getElementById("s-name").value.trim();
    const phone = document.getElementById("s-phone").value.trim() || ui.dialInput;
    state.clients.push({id:uid(), name, phone});
    saveData();
    window.open(waLink(phone, state.settings.whatsappMsg), "_blank");
    closeSheet(); ui.dialInput=""; ui.page="clientes"; render();
    toast("Cliente adicionado.");
  }
}

/* =========================================================
   INIT
   ========================================================= */
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{ /* preview sandbox: ignore */ });
  });
}
</script>
